        - {station_id: "500101002", slot_hour: "2026-11-13 09:00:00+00", min_rent_bikes: 10, max_rent_bikes: 10, avg_rent_bikes: 10, min_return_bikes: 0, max_return_bikes: 0, avg_return_bikes: 0, last_ingested_at: null}
        - {station_id: "500101002", slot_hour: "2026-11-13 10:00:00+00", min_rent_bikes: 5, max_rent_bikes: 5, avg_rent_bikes: 5, min_return_bikes: 5, max_return_bikes: 5, avg_return_bikes: 5, last_ingested_at: "2026-11-13 10:30:40+00"}
